{% extends 'base.html' %}
{% load static %}

{% block title %}สมัครสมาชิก - Viwloo{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card" style="max-width:460px;">
        <div class="auth-header" style="text-align:center;margin-bottom:2rem;">
            <div class="auth-icon" style="margin:0 auto 1.25rem;background:linear-gradient(135deg, rgba(236,72,153,0.2), rgba(124,92,252,0.2));color:var(--pink);">
                <i data-lucide="user-plus" style="width: 26px; height: 26px;"></i>
            </div>
            <h1 class="auth-title" style="font-size:1.75rem;font-weight:700;margin-bottom:0.5rem;">สร้างบัญชีใหม่</h1>
            <p class="auth-subtitle" style="color:var(--text-muted);font-size:0.95rem;">เข้าร่วมชุมชน Viwloo ฟรีได้แล้ววันนี้</p>
        </div>

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_username">ชื่อผู้ใช้ (Username)</label>
                <div class="input-wrapper" style="position:relative;display:flex;align-items:center;">
                    <i data-lucide="user" class="input-icon" style="position:absolute;left:1rem;color:var(--text-muted);pointer-events:none;width:18px;height:18px;"></i>
                    <input 
                        type="text" 
                        name="username" 
                        id="id_username" 
                        class="form-input" 
                        style="padding-left:2.75rem;"
                        placeholder="ตั้งชื่อผู้ใช้ของคุณ"
                        required 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password1">รหัสผ่าน (Password)</label>
                <div class="input-wrapper" style="position:relative;display:flex;align-items:center;">
                    <i data-lucide="key-round" class="input-icon" style="position:absolute;left:1rem;color:var(--text-muted);pointer-events:none;width:18px;height:18px;"></i>
                    <input 
                        type="password" 
                        name="password1" 
                        id="id_password1" 
                        class="form-input" 
                        style="padding-left:2.75rem;"
                        placeholder="อย่างน้อย 8 ตัวอักษร" 
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password2">ยืนยันรหัสผ่าน (Confirm Password)</label>
                <div class="input-wrapper" style="position:relative;display:flex;align-items:center;">
                    <i data-lucide="shield-check" class="input-icon" style="position:absolute;left:1rem;color:var(--text-muted);pointer-events:none;width:18px;height:18px;"></i>
                    <input 
                        type="password" 
                        name="password2" 
                        id="id_password2" 
                        class="form-input" 
                        style="padding-left:2.75rem;"
                        placeholder="กรอกรหัสผ่านอีกครั้ง" 
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-submit" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;background:linear-gradient(135deg, var(--pink) 0%, var(--accent) 100%);">
                <span>สมัครสมาชิก</span>
                <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <div class="auth-footer">
            มีบัญชีผู้ใช้อยู่แล้ว?
            <a href="{% url 'login' %}">เข้าสู่ระบบที่นี่</a>
        </div>
    </div>
</div>
{% endblock %}
