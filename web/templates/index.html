{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Viwloo — Sign in or create an account to start sharing">
    <title>Viwloo — Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'cbp.css' %}">
</head>
<body style="display:flex;align-items:center;justify-content:center;overflow:hidden;">
    <div class="bg-glow"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                </div>
                <h1>Viwloo</h1>
                <p>Discover &amp; share amazing content</p>
            </div>

            <!-- Messages -->
            {% if messages %}
                {% for msg in messages %}
                <div class="msg {{ msg.tags }}">{{ msg.message }}</div>
                {% endfor %}
            {% endif %}

            <!-- Auth Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-target="login-form" id="tab-login">Sign In</div>
                <div class="auth-tab" data-target="signup-form" id="tab-signup">Sign Up</div>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="login-form" method="POST" action="{% url 'index' %}">
                {% csrf_token %}
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <!-- Signup Form -->
            <form class="auth-form" id="signup-form" method="POST" action="{% url 'index' %}">
                {% csrf_token %}
                <input type="hidden" name="action" value="signup">
                <div class="form-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" name="username" placeholder="Choose a username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="your@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="signup-password2">Confirm Password</label>
                    <input type="password" id="signup-password2" name="password2" placeholder="Repeat password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="auth-footer">
                &copy; 2026 Viwloo. All rights reserved.
            </div>
        </div>
    </div>

    <script src="{% static 'logic.js' %}"></script>
    {% if messages %}
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formAction = '{{ request.POST.action|default:"login" }}';
            if (formAction === 'signup') {
                const tabSignup = document.getElementById('tab-signup');
                if (tabSignup) tabSignup.click();
            }
        });
    </script>
    {% endif %}
</body>
</html>
