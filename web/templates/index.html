<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Viwloo — Sign in or create an account to start sharing">
    <title>Viwloo — Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --bg:            #07070a;
            --surface:       #111116;
            --surface-2:     #1a1a22;
            --border:        rgba(255,255,255,0.06);
            --text:          #f0f0f5;
            --text-sec:      #9b9bb0;
            --text-muted:    #5e5e72;
            --accent:        #7c5cfc;
            --accent-glow:   rgba(124,92,252,0.3);
            --accent-hover:  #9478ff;
            --pink:          #f472b6;
            --green:         #34d399;
            --radius:        14px;
            --transition:    0.3s cubic-bezier(.4,0,.2,1);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated gradient bg */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-glow::before, .bg-glow::after {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.25;
            animation: drift 12s ease-in-out infinite alternate;
        }
        .bg-glow::before {
            background: var(--accent);
            top: -20%; left: -10%;
        }
        .bg-glow::after {
            background: var(--pink);
            bottom: -20%; right: -10%;
            animation-delay: -6s;
        }
        @keyframes drift {
            from { transform: translate(0, 0); }
            to   { transform: translate(60px, 40px); }
        }

        /* Container */
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 16px 64px rgba(0,0,0,0.5);
        }

        /* Brand */
        .brand {
            text-align: center;
            margin-bottom: 36px;
        }
        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px; height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            margin-bottom: 16px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .brand-logo svg { width: 28px; height: 28px; }
        .brand h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand p {
            font-size: 14px;
            color: var(--text-sec);
            margin-top: 6px;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            margin-bottom: 28px;
            border-radius: 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 4px;
        }
        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 9px;
            transition: var(--transition);
        }
        .auth-tab:hover { color: var(--text-sec); }
        .auth-tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        /* Forms */
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeUp 0.35s ease; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sec);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            transition: var(--transition);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-group input::placeholder { color: var(--text-muted); }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 4px;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 24px var(--accent-glow);
            transform: translateY(-2px);
        }
        .btn-primary:active { transform: translateY(0); }

        /* Messages */
        .msg {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            animation: fadeUp 0.3s ease;
        }
        .msg.error   { background: rgba(255,77,106,0.12); color: #ff6b8a; border: 1px solid rgba(255,77,106,0.2); }
        .msg.success { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.2); }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                </div>
                <h1>Viwloo</h1>
                <p>Discover &amp; share amazing content</p>
            </div>

            <!-- Messages -->
            {% if messages %}
                {% for msg in messages %}
                <div class="msg {{ msg.tags }}">{{ msg.message }}</div>
                {% endfor %}
            {% endif %}

            <!-- Auth Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-target="login-form" id="tab-login">Sign In</div>
                <div class="auth-tab" data-target="signup-form" id="tab-signup">Sign Up</div>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="login-form" method="POST" action="{% url 'index' %}">
                {% csrf_token %}
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <!-- Signup Form -->
            <form class="auth-form" id="signup-form" method="POST" action="{% url 'index' %}">
                {% csrf_token %}
                <input type="hidden" name="action" value="signup">
                <div class="form-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" name="username" placeholder="Choose a username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="your@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="At least 8 characters" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="signup-password2">Confirm Password</label>
                    <input type="password" id="signup-password2" name="password2" placeholder="Repeat password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="auth-footer">
                &copy; 2026 Viwloo. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        const tabs = document.querySelectorAll('.auth-tab');
        const forms = document.querySelectorAll('.auth-form');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                forms.forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        // If there's an error and action was signup, auto-switch to signup tab
        {% if messages %}
            const formAction = '{{ request.POST.action|default:"login" }}';
            if (formAction === 'signup') {
                document.getElementById('tab-signup').click();
            }
        {% endif %}
    </script>
</body>
</html>
