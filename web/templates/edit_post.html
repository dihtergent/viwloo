{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Edit Post — Viwloo">
    <title>Edit Post — Viwloo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'cbp.css' %}">
</head>
<body>

    <!-- TOAST MESSAGES -->
    {% if messages %}
    <div class="toast-container">
        {% for msg in messages %}
        <div class="toast {{ msg.tags }}">{{ msg.message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- HEADER -->
    <header class="header">
        <a href="{% url 'post_detail' post.id %}" class="back-btn" title="Cancel and Return">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="header-title">Edit Post</span>
    </header>

    <!-- FORM CONTAINER -->
    <main class="feed-container" style="max-width:640px;padding:30px 20px 100px;">
        <div class="modal-card" style="padding:28px;max-width:100%;">
            <h2 class="card-title" style="font-size:20px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:10px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Edit Post Details
            </h2>

            <form method="POST" action="{% url 'edit_post' post.id %}" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Title -->
                <div class="form-group">
                    <label class="form-label" for="title">Title *</label>
                    <input type="text" class="form-input" id="title" name="title" value="{{ post.title }}" required placeholder="Give your post a title">
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <select class="form-select" id="category" name="category">
                        <option value="interknot" {% if post.category == 'interknot' or post.category != 'proxy' %}selected{% endif %}>Interknot</option>
                        <option value="proxy" {% if post.category == 'proxy' %}selected{% endif %}>Proxy</option>
                    </select>
                </div>

                <!-- Body -->
                <div class="form-group">
                    <label class="form-label" for="body">Description / Thoughts</label>
                    <textarea class="form-textarea" id="body" name="body" placeholder="Share more details…">{{ post.body }}</textarea>
                </div>

                <!-- Image -->
                <div class="form-group">
                    <label class="form-label">Post Image</label>
                    {% if post.image %}
                    <div style="border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);margin-top:8px;max-height:240px;">
                        <img src="{{ post.image.url }}" alt="Current post image" style="width:100%;height:240px;object-fit:cover;display:block;">
                    </div>
                    {% endif %}
                    <label class="form-label" style="margin-top:10px;">Replace Image (Optional)</label>
                    <input type="file" class="form-input" name="image" accept="image/*">
                </div>

                <!-- GPS Location -->
                <div class="form-group">
                    <label class="form-label">Check-in Location</label>
                    <div class="location-group">
                        <div class="location-header">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--pink);"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            <span>Location</span>
                            <button type="button" class="gps-btn" id="gps-btn" onclick="getGPSLocation()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
                                <span id="gps-btn-text">Update GPS</span>
                            </button>
                        </div>
                        <input type="text" class="location-input" id="location-name" name="location_name" value="{{ post.location_name }}" placeholder="Place name (e.g. Siam Paragon, Bangkok)">
                        <input type="hidden" id="post-latitude" name="latitude" value="{{ post.latitude|default:'' }}">
                        <input type="hidden" id="post-longitude" name="longitude" value="{{ post.longitude|default:'' }}">
                    </div>
                </div>

                <!-- Actions -->
                <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);">
                    <a href="{% url 'post_detail' post.id %}" class="modal-close" style="width:auto;height:auto;padding:10px 22px;border-radius:24px;text-decoration:none;font-size:14px;font-weight:700;">Cancel</a>
                    <button type="submit" class="btn-submit" style="width:auto;padding:10px 24px;border-radius:24px;" id="save-post-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </main>

    <script src="{% static 'logic.js' %}"></script>
</body>
</html>
