{% extends 'base.html' %}

{% block title %}เข้าสู่ระบบ - Viwloo{% endblock %}

{% block extra_head %}
<style>
    .auth-page {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
    }

    .auth-card {
        width: 100%;
        max-width: 440px;
        background: var(--bg-card);
        border: 1px solid var(--bg-card-border);
        border-radius: 24px;
        padding: 2.75rem 2.25rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(16px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a5b4fc;
    }

    .auth-title {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 0.5rem;
    }

    .auth-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #cbd5e1;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        color: var(--text-muted);
        pointer-events: none;
        width: 18px;
        height: 18px;
    }

    .form-input {
        width: 100%;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--text-main);
        padding: 0.85rem 1rem 0.85rem 2.75rem;
        border-radius: 12px;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s ease;
    }

    .form-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-glow);
        background: rgba(15, 23, 42, 0.9);
    }

    .toggle-password {
        position: absolute;
        right: 1rem;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        padding: 0;
    }

    .toggle-password:hover {
        color: var(--text-main);
    }

    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-muted);
        cursor: pointer;
    }

    .remember-me input {
        accent-color: var(--primary);
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    .forgot-link {
        color: #818cf8;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.15s;
    }

    .forgot-link:hover {
        color: #a5b4fc;
        text-decoration: underline;
    }

    .btn-submit {
        width: 100%;
        padding: 0.9rem;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px var(--primary-glow);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
    }

    .btn-submit:active {
        transform: translateY(0);
    }

    .auth-footer {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-muted);
        border-top: 1px solid var(--bg-card-border);
        padding-top: 1.5rem;
    }

    .auth-footer a {
        color: #818cf8;
        text-decoration: none;
        font-weight: 600;
        margin-left: 0.25rem;
    }

    .auth-footer a:hover {
        color: #a5b4fc;
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i data-lucide="lock" style="width: 26px; height: 26px;"></i>
            </div>
            <h1 class="auth-title">เข้าสู่ระบบ</h1>
            <p class="auth-subtitle">เข้าสู่ระบบเพื่อเริ่มใช้งาน Viwloo</p>
        </div>

        <form method="POST" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">ชื่อผู้ใช้ หรือ อีเมล (Username / Email)</label>
                <div class="input-wrapper">
                    <i data-lucide="user" class="input-icon"></i>
                    <input 
                        type="text" 
                        name="username" 
                        id="username" 
                        class="form-input" 
                        placeholder="กรอกชื่อผู้ใช้ หรืออีเมลของคุณ"
                        value="{{ username|default:'' }}"
                        required 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">รหัสผ่าน (Password)</label>
                <div class="input-wrapper">
                    <i data-lucide="key-round" class="input-icon"></i>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••" 
                        required
                    >
                    <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="แสดง/ซ่อนรหัสผ่าน">
                        <i data-lucide="eye" id="toggleEyeIcon" style="width: 18px; height: 18px;"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember_me">
                    <span>จดจำการเข้าสู่ระบบ</span>
                </label>
            </div>

            <button type="submit" class="btn-submit">
                <span>เข้าสู่ระบบ</span>
                <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <div class="auth-footer">
            ยังไม่มีบัญชีใช่หรือไม่?
            <a href="{% url 'register' %}">สมัครสมาชิกที่นี่</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('toggleEyeIcon');

    toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
        lucide.createIcons();
    });
</script>
{% endblock %}
