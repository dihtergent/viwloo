{% extends 'base.html' %}
{% load static %}

{% block title %}เข้าสู่ระบบ - Viwloo{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header" style="text-align:center;margin-bottom:2rem;">
            <div class="auth-icon" style="margin:0 auto 1.25rem;">
                <i data-lucide="lock" style="width: 26px; height: 26px;"></i>
            </div>
            <h1 class="auth-title" style="font-size:1.75rem;font-weight:700;margin-bottom:0.5rem;">เข้าสู่ระบบ</h1>
            <p class="auth-subtitle" style="color:var(--text-muted);font-size:0.95rem;">เข้าสู่ระบบเพื่อเริ่มใช้งาน Viwloo</p>
        </div>

        <form method="POST" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">ชื่อผู้ใช้ หรือ อีเมล (Username / Email)</label>
                <div class="input-wrapper" style="position:relative;display:flex;align-items:center;">
                    <i data-lucide="user" class="input-icon" style="position:absolute;left:1rem;color:var(--text-muted);pointer-events:none;width:18px;height:18px;"></i>
                    <input 
                        type="text" 
                        name="username" 
                        id="username" 
                        class="form-input" 
                        style="padding-left:2.75rem;"
                        placeholder="กรอกชื่อผู้ใช้ หรืออีเมลของคุณ"
                        value="{{ username|default:'' }}"
                        required 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">รหัสผ่าน (Password)</label>
                <div class="input-wrapper" style="position:relative;display:flex;align-items:center;">
                    <i data-lucide="key-round" class="input-icon" style="position:absolute;left:1rem;color:var(--text-muted);pointer-events:none;width:18px;height:18px;"></i>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        class="form-input" 
                        style="padding-left:2.75rem;padding-right:2.75rem;"
                        placeholder="••••••••" 
                        required
                    >
                    <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="แสดง/ซ่อนรหัสผ่าน" style="position:absolute;right:1rem;background:none;border:none;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;padding:0;">
                        <i data-lucide="eye" id="toggleEyeIcon" style="width: 18px; height: 18px;"></i>
                    </button>
                </div>
            </div>

            <div class="form-options" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-size:0.875rem;">
                <label class="remember-me" style="display:flex;align-items:center;gap:0.5rem;color:var(--text-muted);cursor:pointer;">
                    <input type="checkbox" name="remember_me">
                    <span>จดจำการเข้าสู่ระบบ</span>
                </label>
            </div>

            <button type="submit" class="btn-submit" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;">
                <span>เข้าสู่ระบบ</span>
                <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        <div class="auth-footer">
            ยังไม่มีบัญชีใช่หรือไม่?
            <a href="{% url 'register' %}">สมัครสมาชิกที่นี่</a>
        </div>
    </div>
</div>
{% endblock %}
